<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Michael J. Crockett's personal website.">
  <title>Michael J. Crockett</title>
  <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="modulepreload" href="engine.js">
  <link rel="modulepreload" href="routing.js">
  <link rel="modulepreload" href="snake.js">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="terminal" aria-label="Michael J. Crockett’s website">
    <header class="bar">
      <div class="bar-clip">
        <div class="bar-content">
          <h1 class="site-name">Michael J. Crockett</h1>
          <p class="site-status">Site in progress</p>
        </div>
      </div>
    </header>
    <div class="screen" id="screen" role="region" tabindex="0" aria-label="Terminal output, scroll to review previous commands">
<!-- BEGIN GENERATED README -->
<!-- END GENERATED README -->
    </div>
    <div id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <section class="entry" aria-label="Command input" hidden>
      <form id="command-form" autocomplete="off">
        <span class="prompt" id="prompt">guest:~ $</span>
        <input id="command" name="command" type="text" maxlength="500" aria-label="Terminal command" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="completions" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
        <button type="button" id="tools-toggle" class="tools-toggle" aria-expanded="false" aria-controls="command-tools">Tools</button>
        <button type="submit" class="run" aria-label="Run command">↵</button>
      </form>
      <div id="completion-panel" class="completion-panel" hidden>
        <p id="completion-status" class="completion-status"></p>
        <div id="completions" class="completions" role="listbox" hidden aria-label="Completion choices"></div>
      </div>
      <div class="tools-shell">
        <div class="tools-clip">
          <div class="toolbar" id="command-tools">
            <button type="button" data-command="help" class="show-commands" aria-label="Show commands"><span class="wide-label">Show commands</span><span class="compact-label" aria-hidden="true">Commands</span></button>
            <div class="keys">
              <button type="button" id="complete" aria-label="Complete command or path" title="Complete command or path">⇥<span> complete</span></button>
              <button type="button" id="previous" aria-label="Previous command" title="Previous command">↑</button>
              <button type="button" id="next" aria-label="Next command" title="Next command">↓</button>
            </div>
          </div>
        </div>
      </div>
      <button type="button" id="read-output" class="sr-only focus-show">Read command output</button>
    </section>
  </main>
</body>
</html>
